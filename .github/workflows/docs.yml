name: Deploy docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["trunk"]
    paths:
      - kernel_api/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out'
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          path: 'kernel'
      - name: 'Install tooling'
        uses: ./kernel/.github/actions/install-tooling
      - uses: r7kamura/rust-problem-matchers@v1
      - name: Build docs
        id: doc-build
        run: |
          echo "BUILD_DIR=$(./xbstrap/pop --sysroot=sysroot --target x86_64-unknown-popcorn --local-source @core/kernel=./kernel/ info --build-dir)" >> $GITHUB_OUTPUT
          ./xbstrap/pop --sysroot=sysroot --target x86_64-unknown-popcorn --local-source @core/kernel=./kernel/ run @core/kernel cargo doc -p kernel_api --no-deps --document-private-items
      - name: Generate index page
        run: echo "<head><meta http-equiv='refresh' content='0; URL=/kernel_api/index.html'></head>" > ${{ steps.doc-build.outputs.BUILD_DIR }}/target/x86_64-unknown-popcorn/doc/index.html
      - name: Fix permissions
        run: |
          chmod -c -R +rX "${{ steps.doc-build.outputs.BUILD_DIR }}/target/x86_64-unknown-popcorn/doc/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ steps.doc-build.outputs.BUILD_DIR }}/target/x86_64-unknown-popcorn/doc'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
